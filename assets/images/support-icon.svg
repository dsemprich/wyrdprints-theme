<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Support Icon">
  <title>Support</title>
  <g fill="#4DB6C6">
    <!-- head -->
    <circle cx="64" cy="54" r="20"/>

    <!-- eyes -->
    <circle cx="56" cy="52" r="3" fill="#ffffff"/>
    <circle cx="72" cy="52" r="3" fill="#ffffff"/>

    <!-- mouth -->
    <path d="M56 62c4 4 12 4 16 0" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- headset band -->
    <path d="M34 54c0-18 60-18 60 0" fill="none" stroke="#4DB6C6" stroke-width="8" stroke-linecap="round"/>

    <!-- ear pads -->
    <rect x="28" y="54" width="10" height="18" rx="4"/>
    <rect x="90" y="54" width="10" height="18" rx="4"/>

    <!-- mic -->
    <path d="M92 74c10 0 10 12 0 12h-8" fill="none" stroke="#4DB6C6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
